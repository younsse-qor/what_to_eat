<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>나의 레시피 상자</title>
<meta name="description" content="내가 만든 레시피를 검색하고 가나다순으로 정리해서 보는 개인 레시피 앱" />

<link rel="manifest" href="manifest.json?v=7" />
<link rel="icon" href="icons/icon-192.png?v=7" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=7" />

<meta name="theme-color" content="#fff6ec" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#241b17" media="(prefers-color-scheme: dark)" />

<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="레시피 상자" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>
  :root {
    --bg: #fff6ec;
    --surface: #ffffff;
    --surface-2: #fff1e4;
    --ink: #4a372e;
    --ink-soft: #8a7466;
    --ink-faint: #b7a99b;
    --accent: #ff6f59;
    --accent-ink: #ffffff;
    --accent-soft: #ffe0d8;
    --herb: #2f9c74;
    --herb-soft: #dcf5e9;
    --line: #f3e4d6;
    --line-strong: #ead3bc;
    --shadow: 0 2px 6px rgba(74, 55, 46, 0.08), 0 10px 24px -12px rgba(255, 111, 89, 0.35);
    --radius: 20px;
    --danger: #e0507c;

    --tag-1-bg: #ffe1e9; --tag-1-fg: #c43f63;
    --tag-2-bg: #fff1bf; --tag-2-fg: #96770a;
    --tag-3-bg: #d8f5e4; --tag-3-fg: #268a5b;
    --tag-4-bg: #e7e1ff; --tag-4-fg: #5c4fd1;
    --tag-5-bg: #d9f0ff; --tag-5-fg: #1c7fb8;
    --tag-6-bg: #ffe3ce; --tag-6-fg: #c1631a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #241b17;
      --surface: #2f2420;
      --surface-2: #3a2c26;
      --ink: #f5e9de;
      --ink-soft: #c7b3a3;
      --ink-faint: #8f7c6e;
      --accent: #ff8a70;
      --accent-ink: #2b160f;
      --accent-soft: #4a2b22;
      --herb: #6fcb9f;
      --herb-soft: #234438;
      --line: #402f27;
      --line-strong: #4f3b31;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.35), 0 10px 24px -12px rgba(255, 138, 112, 0.3);
      --danger: #ff7a9c;

      --tag-1-bg: #4a2530; --tag-1-fg: #ffb0c4;
      --tag-2-bg: #453718; --tag-2-fg: #f5d680;
      --tag-3-bg: #1d3b2c; --tag-3-fg: #8fe3b8;
      --tag-4-bg: #2c2650; --tag-4-fg: #c2b6ff;
      --tag-5-bg: #1b3444; --tag-5-fg: #90d6ff;
      --tag-6-bg: #452c18; --tag-6-fg: #ffbe86;
    }
  }

  :root[data-theme="dark"] {
    --bg: #241b17;
    --surface: #2f2420;
    --surface-2: #3a2c26;
    --ink: #f5e9de;
    --ink-soft: #c7b3a3;
    --ink-faint: #8f7c6e;
    --accent: #ff8a70;
    --accent-ink: #2b160f;
    --accent-soft: #4a2b22;
    --herb: #6fcb9f;
    --herb-soft: #234438;
    --line: #402f27;
    --line-strong: #4f3b31;
    --shadow: 0 2px 6px rgba(0, 0, 0, 0.35), 0 10px 24px -12px rgba(255, 138, 112, 0.3);
    --danger: #ff7a9c;

    --tag-1-bg: #4a2530; --tag-1-fg: #ffb0c4;
    --tag-2-bg: #453718; --tag-2-fg: #f5d680;
    --tag-3-bg: #1d3b2c; --tag-3-fg: #8fe3b8;
    --tag-4-bg: #2c2650; --tag-4-fg: #c2b6ff;
    --tag-5-bg: #1b3444; --tag-5-fg: #90d6ff;
    --tag-6-bg: #452c18; --tag-6-fg: #ffbe86;
  }

  :root[data-theme="light"] {
    --bg: #fff6ec;
    --surface: #ffffff;
    --surface-2: #fff1e4;
    --ink: #4a372e;
    --ink-soft: #8a7466;
    --ink-faint: #b7a99b;
    --accent: #ff6f59;
    --accent-ink: #ffffff;
    --accent-soft: #ffe0d8;
    --herb: #2f9c74;
    --herb-soft: #dcf5e9;
    --line: #f3e4d6;
    --line-strong: #ead3bc;
    --shadow: 0 2px 6px rgba(74, 55, 46, 0.08), 0 10px 24px -12px rgba(255, 111, 89, 0.35);
    --danger: #e0507c;

    --tag-1-bg: #ffe1e9; --tag-1-fg: #c43f63;
    --tag-2-bg: #fff1bf; --tag-2-fg: #96770a;
    --tag-3-bg: #d8f5e4; --tag-3-fg: #268a5b;
    --tag-4-bg: #e7e1ff; --tag-4-fg: #5c4fd1;
    --tag-5-bg: #d9f0ff; --tag-5-fg: #1c7fb8;
    --tag-6-bg: #ffe3ce; --tag-6-fg: #c1631a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 980px;
    margin: 0 auto;
    padding: 36px 24px 80px;
  }

  header.top {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 28px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--herb);
    font-weight: 600;
  }

  h1 {
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-weight: 800;
    font-size: clamp(26px, 4vw, 34px);
    margin: 0;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }

  .sub {
    color: var(--ink-soft);
    font-size: 14.5px;
    margin-top: 2px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin: 22px 0 16px;
  }

  .search-wrap {
    position: relative;
    flex: 1 1 240px;
    min-width: 200px;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--ink-faint);
    pointer-events: none;
  }

  input[type="text"], input[type="search"], textarea, select {
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    padding: 10px 12px;
    font-size: 14.5px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input[type="text"]:focus, input[type="search"]:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }

  #search {
    width: 100%;
    padding-left: 34px;
  }

  .sort-select {
    cursor: pointer;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .btn:hover { border-color: var(--line-strong); background: var(--surface-2); transform: translateY(-1px); }
  .btn:active { transform: scale(0.96); }

  @media (prefers-reduced-motion: reduce) {
    .btn:hover, .btn:active { transform: none; }
  }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .btn.primary:hover { filter: brightness(1.06); }

  .btn.ghost {
    background: transparent;
    border-color: transparent;
    color: var(--ink-soft);
  }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }

  .btn.danger { color: var(--danger); }

  .tagbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
  }

  .chip {
    border: 1px solid transparent;
    background: var(--surface);
    color: var(--ink-soft);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    transition: transform 0.12s ease;
  }

  .chip:hover { transform: translateY(-1px); }

  .chip.tag-color-1 { background: var(--tag-1-bg); color: var(--tag-1-fg); }
  .chip.tag-color-2 { background: var(--tag-2-bg); color: var(--tag-2-fg); }
  .chip.tag-color-3 { background: var(--tag-3-bg); color: var(--tag-3-fg); }
  .chip.tag-color-4 { background: var(--tag-4-bg); color: var(--tag-4-fg); }
  .chip.tag-color-5 { background: var(--tag-5-bg); color: var(--tag-5-fg); }
  .chip.tag-color-6 { background: var(--tag-6-bg); color: var(--tag-6-fg); }

  .chip.active {
    background: var(--ink);
    color: var(--bg);
    box-shadow: var(--shadow);
  }

  @media (prefers-reduced-motion: reduce) {
    .chip:hover { transform: none; }
  }

  .count-line {
    font-size: 13px;
    color: var(--ink-faint);
    margin: -6px 0 18px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }

  .card-btn {
    all: unset;
    cursor: pointer;
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 16px 16px;
    box-shadow: var(--shadow);
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 150px;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  @media (prefers-reduced-motion: no-preference) {
    .card:hover {
      transform: translateY(-4px) rotate(-0.6deg);
      box-shadow: 0 4px 10px rgba(74, 55, 46, 0.1), 0 16px 30px -14px rgba(255, 111, 89, 0.45);
    }
  }

  .card-title {
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-weight: 800;
    font-size: 17px;
    margin: 0;
    line-height: 1.3;
    text-wrap: balance;
  }

  .card-meta {
    font-size: 12.5px;
    color: var(--ink-faint);
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: auto;
  }

  .tag-pill {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--herb-soft);
    color: var(--herb);
  }

  .tag-pill.tag-color-1 { background: var(--tag-1-bg); color: var(--tag-1-fg); }
  .tag-pill.tag-color-2 { background: var(--tag-2-bg); color: var(--tag-2-fg); }
  .tag-pill.tag-color-3 { background: var(--tag-3-bg); color: var(--tag-3-fg); }
  .tag-pill.tag-color-4 { background: var(--tag-4-bg); color: var(--tag-4-fg); }
  .tag-pill.tag-color-5 { background: var(--tag-5-bg); color: var(--tag-5-fg); }
  .tag-pill.tag-color-6 { background: var(--tag-6-bg); color: var(--tag-6-fg); }

  .card-preview {
    font-size: 13px;
    color: var(--ink-soft);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 20px;
    color: var(--ink-soft);
  }

  .empty-emoji {
    font-size: 44px;
    margin-bottom: 10px;
  }

  .empty h2 {
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: var(--ink);
    margin: 0 0 6px;
  }

  /* modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--ink) 45%, transparent);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
    z-index: 20;
  }

  .overlay[hidden] { display: none; }

  .modal {
    background: var(--surface);
    border-radius: 24px;
    max-width: 640px;
    width: 100%;
    padding: 28px 28px 24px;
    box-shadow: var(--shadow);
    animation: rise 0.16s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .modal { animation: none; }
  }

  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 4px;
  }

  .modal h2 {
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-weight: 800;
    font-size: 22px;
    margin: 0;
    text-wrap: balance;
  }

  .close-x {
    all: unset;
    cursor: pointer;
    color: var(--ink-faint);
    padding: 4px;
    border-radius: 8px;
  }
  .close-x:hover { background: var(--surface-2); color: var(--ink); }

  .section-label {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--herb);
    font-weight: 700;
    margin: 20px 0 8px;
  }

  .ingredient-list, .step-list {
    margin: 0;
    padding-left: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .ingredient-list li {
    display: flex;
    gap: 10px;
    font-size: 14.5px;
    padding: 8px 10px;
    background: var(--surface-2);
    border-radius: 12px;
  }

  .ingredient-list li .amt {
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    margin-left: auto;
    white-space: nowrap;
    font-size: 13.5px;
  }

  .step-list {
    counter-reset: step;
  }

  .step-list li {
    display: flex;
    gap: 12px;
    font-size: 14.5px;
  }

  .step-list li::before {
    counter-increment: step;
    content: counter(step);
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  /* form */
  .form-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  label {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-soft);
    display: block;
    margin-bottom: 6px;
  }

  .field textarea, .field input {
    width: 100%;
  }

  .field textarea {
    resize: vertical;
    min-height: 90px;
    line-height: 1.5;
  }

  .hint {
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 4px;
  }

  .step-input-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }

  .step-input-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .step-input-num {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
  }

  .step-input-row input {
    flex: 1;
    min-width: 0;
  }

  .step-remove {
    all: unset;
    cursor: pointer;
    color: var(--ink-faint);
    padding: 4px;
    border-radius: 6px;
    flex: 0 0 auto;
    display: flex;
  }
  .step-remove:hover { background: var(--surface-2); color: var(--danger); }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: var(--shadow);
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-8px);
  }

  @media (prefers-reduced-motion: reduce) {
    .toast, .toast.show { transform: translateX(-50%); }
  }

  .footer-note {
    margin-top: 40px;
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-faint);
  }

  .footer-note button {
    background: none;
    border: none;
    color: var(--ink-faint);
    text-decoration: underline;
    font-size: 12.5px;
    padding: 0;
  }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <span class="eyebrow">🍳 나의 레시피 상자</span>
    <h1>오늘은 뭐 해먹지 🤔</h1>
    <p class="sub">그동안 만든 레시피를 모아두고, 검색하거나 가나다순으로 꺼내 보세요.</p>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="레시피, 재료, 태그로 검색" autocomplete="off" />
    </div>
    <select id="sortSelect" class="sort-select btn" aria-label="정렬 방식">
      <option value="alpha">🔤 가나다순</option>
      <option value="recent">🕐 최근 추가순</option>
    </select>
    <button class="btn" id="exportBtn" title="레시피를 JSON 파일로 저장">📤 내보내기</button>
    <button class="btn" id="importBtn" title="JSON 파일에서 레시피 불러오기">📥 가져오기</button>
    <input type="file" id="importFile" accept="application/json" class="visually-hidden" />
    <button class="btn primary" id="addBtn">✨ 레시피 추가</button>
  </div>

  <div class="tagbar" id="tagbar"></div>
  <p class="count-line" id="countLine"></p>

  <div class="grid" id="grid"></div>

  <p class="footer-note">📱 이 브라우저에만 저장됩니다. 다른 기기에서 보려면 내보내기한 파일을 가져오기 하세요.</p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="detailOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" id="detailModal"></div>
</div>

<div class="overlay" id="formOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="formTitle">레시피 추가</h2>
      <button class="close-x" id="formClose" aria-label="닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form id="recipeForm" class="form-grid">
      <div class="field">
        <label for="f-title">레시피 이름</label>
        <input id="f-title" type="text" required placeholder="예: 김치찌개" />
      </div>
      <div class="field">
        <label for="f-tags">태그 / 카테고리</label>
        <input id="f-tags" type="text" placeholder="한식, 찌개, 저녁" />
        <p class="hint">쉼표로 구분해서 입력</p>
      </div>
      <div class="field">
        <label for="f-ingredients">재료</label>
        <textarea id="f-ingredients" placeholder="돼지고기 200g&#10;김치 1/2포기&#10;두부 1모"></textarea>
        <p class="hint">한 줄에 재료 하나씩. "재료 분량" 순서로 쓰면 자동으로 정렬돼요.</p>
      </div>
      <div class="field">
        <label>조리 순서</label>
        <div id="stepsList" class="step-input-list"></div>
        <button type="button" class="btn ghost add-step-btn" id="addStepBtn">➕ 단계 추가</button>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="formCancel">취소</button>
        <button type="submit" class="btn primary" id="formSubmit">저장</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "recipe-box-v1";

  /** @typedef {{id:string, title:string, tags:string[], ingredients:string[], steps:string[], createdAt:number}} Recipe */

  /** @type {Recipe[]} */
  let recipes = load();
  let activeTag = null;
  let sortMode = "alpha";
  let editingId = null;

  const $ = (sel) => document.querySelector(sel);
  const grid = $("#grid");
  const tagbar = $("#tagbar");
  const countLine = $("#countLine");
  const searchInput = $("#search");
  const sortSelect = $("#sortSelect");
  const toastEl = $("#toast");

  let toastTimer = null;
  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return seedData();
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) return parsed;
      return seedData();
    } catch (e) {
      return seedData();
    }
  }

  function seedData() {
    return [
      {
        id: cryptoId(),
        title: "김치찌개",
        tags: ["한식", "찌개"],
        ingredients: ["신김치 1/2포기", "돼지고기 200g", "두부 1모", "대파 1대", "고춧가루 1큰술"],
        steps: ["냄비에 돼지고기와 김치를 넣고 볶는다", "물을 부어 끓인다", "두부와 대파를 넣고 5분 더 끓인다"],
        createdAt: Date.now() - 200000,
      },
      {
        id: cryptoId(),
        title: "계란볶음밥",
        tags: ["한식", "간단요리"],
        ingredients: ["밥 1공기", "계란 2개", "대파 1/4대", "간장 1큰술", "참기름 약간"],
        steps: ["팬에 기름을 두르고 계란을 스크램블한다", "밥을 넣고 볶는다", "간장과 대파를 넣고 마무리한다"],
        createdAt: Date.now() - 100000,
      },
    ];
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
  }

  function cryptoId() {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  function splitLines(text) {
    return text.split("\n").map((s) => s.trim()).filter(Boolean);
  }

  function splitTags(text) {
    return text.split(",").map((s) => s.trim()).filter(Boolean);
  }

  function colorIndex(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return (h % 6) + 1;
  }

  function allTags() {
    const set = new Set();
    recipes.forEach((r) => r.tags.forEach((t) => set.add(t)));
    return Array.from(set).sort((a, b) => a.localeCompare(b, "ko"));
  }

  function parseIngredientLine(line) {
    const bits = line.split(/\s+(?=[\d./~])/);
    if (bits.length > 1) {
      return { name: bits[0].trim(), amt: bits.slice(1).join(" ").trim() };
    }
    return { name: line, amt: "" };
  }

  function render() {
    renderTagbar();
    const q = searchInput.value.trim().toLowerCase();
    let list = recipes.filter((r) => {
      if (activeTag && !r.tags.includes(activeTag)) return false;
      if (!q) return true;
      const haystack = [r.title, ...r.tags, ...r.ingredients].join(" ").toLowerCase();
      return haystack.includes(q);
    });

    list = list.slice().sort((a, b) => {
      if (sortMode === "recent") return b.createdAt - a.createdAt;
      return a.title.localeCompare(b.title, "ko");
    });

    countLine.textContent = recipes.length === 0
      ? ""
      : `총 ${recipes.length}개 중 ${list.length}개 표시`;

    grid.innerHTML = "";
    if (list.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = recipes.length === 0
        ? `<div class="empty-emoji">🍳</div><h2>아직 레시피가 없어요</h2><p>위쪽 "✨ 레시피 추가" 버튼으로 첫 레시피를 넣어보세요.</p>`
        : `<div class="empty-emoji">🔍</div><h2>검색 결과가 없어요</h2><p>다른 검색어나 태그를 시도해보세요.</p>`;
      grid.appendChild(empty);
      return;
    }

    list.forEach((r) => {
      const card = document.createElement("button");
      card.className = "card card-btn";
      card.setAttribute("aria-haspopup", "dialog");
      card.innerHTML = `
        <h3 class="card-title">${escapeHtml(r.title)}</h3>
        <p class="card-meta">재료 ${r.ingredients.length}개</p>
        <p class="card-preview">${escapeHtml(r.ingredients.slice(0, 3).join(", "))}</p>
        <div class="card-tags">${r.tags.map((t) => `<span class="tag-pill tag-color-${colorIndex(t)}">${escapeHtml(t)}</span>`).join("")}</div>
      `;
      card.addEventListener("click", () => openDetail(r.id));
      grid.appendChild(card);
    });
  }

  function renderTagbar() {
    const tags = allTags();
    tagbar.innerHTML = "";
    if (tags.length === 0) return;
    const allChip = document.createElement("button");
    allChip.className = "chip" + (activeTag === null ? " active" : "");
    allChip.textContent = "전체";
    allChip.addEventListener("click", () => { activeTag = null; render(); });
    tagbar.appendChild(allChip);

    tags.forEach((t) => {
      const chip = document.createElement("button");
      chip.className = "chip tag-color-" + colorIndex(t) + (activeTag === t ? " active" : "");
      chip.textContent = t;
      chip.addEventListener("click", () => { activeTag = activeTag === t ? null : t; render(); });
      tagbar.appendChild(chip);
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  // ---- Detail modal ----
  const detailOverlay = $("#detailOverlay");
  const detailModal = $("#detailModal");

  function openDetail(id) {
    const r = recipes.find((x) => x.id === id);
    if (!r) return;
    detailModal.innerHTML = `
      <div class="modal-head">
        <div>
          <h2>${escapeHtml(r.title)}</h2>
          <p class="card-meta" style="margin-top:6px;">재료 ${r.ingredients.length}개 · 조리 순서 ${r.steps.length}단계</p>
        </div>
        <button class="close-x" aria-label="닫기" id="detailClose">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="card-tags">${r.tags.map((t) => `<span class="tag-pill tag-color-${colorIndex(t)}">${escapeHtml(t)}</span>`).join("")}</div>
      <p class="section-label">재료</p>
      <ul class="ingredient-list">
        ${r.ingredients.map((line) => {
          const p = parseIngredientLine(line);
          return `<li><span>${escapeHtml(p.name)}</span>${p.amt ? `<span class="amt">${escapeHtml(p.amt)}</span>` : ""}</li>`;
        }).join("")}
      </ul>
      <p class="section-label">조리 순서</p>
      <ol class="step-list">
        ${r.steps.map((s) => `<li>${escapeHtml(s)}</li>`).join("")}
      </ol>
      <div class="modal-actions">
        <button class="btn danger" id="detailDelete">🗑️ 삭제</button>
        <button class="btn" id="detailEdit">✏️ 수정</button>
        <button class="btn primary" id="detailDone">닫기</button>
      </div>
    `;
    detailOverlay.hidden = false;
    $("#detailClose").addEventListener("click", closeDetail);
    $("#detailDone").addEventListener("click", closeDetail);
    $("#detailDelete").addEventListener("click", () => {
      if (confirm(`"${r.title}" 레시피를 삭제할까요?`)) {
        recipes = recipes.filter((x) => x.id !== id);
        save();
        closeDetail();
        render();
        showToast("🗑️ 삭제했어요");
      }
    });
    $("#detailEdit").addEventListener("click", () => {
      closeDetail();
      openForm(r);
    });
  }

  function closeDetail() {
    detailOverlay.hidden = true;
    detailModal.innerHTML = "";
  }

  detailOverlay.addEventListener("click", (e) => {
    if (e.target === detailOverlay) closeDetail();
  });

  // ---- Form modal (add/edit) ----
  const formOverlay = $("#formOverlay");
  const formTitle = $("#formTitle");
  const recipeForm = $("#recipeForm");
  const fTitle = $("#f-title");
  const fTags = $("#f-tags");
  const fIngredients = $("#f-ingredients");
  const stepsList = $("#stepsList");
  const addStepBtn = $("#addStepBtn");

  function renumberSteps() {
    stepsList.querySelectorAll(".step-input-row").forEach((row, i) => {
      row.querySelector(".step-input-num").textContent = String(i + 1);
    });
  }

  function addStepRow(value) {
    const row = document.createElement("div");
    row.className = "step-input-row";
    row.innerHTML = `
      <span class="step-input-num"></span>
      <input type="text" class="step-input" placeholder="예: 김치를 볶는다" />
      <button type="button" class="step-remove" aria-label="이 단계 삭제">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg>
      </button>
    `;
    row.querySelector(".step-input").value = value || "";
    row.querySelector(".step-remove").addEventListener("click", () => {
      row.remove();
      renumberSteps();
    });
    stepsList.appendChild(row);
    renumberSteps();
    return row;
  }

  function setStepRows(steps) {
    stepsList.innerHTML = "";
    const values = steps && steps.length ? steps : [""];
    values.forEach((v) => addStepRow(v));
  }

  function collectSteps() {
    return Array.from(stepsList.querySelectorAll(".step-input"))
      .map((el) => el.value.trim())
      .filter(Boolean);
  }

  addStepBtn.addEventListener("click", () => {
    addStepRow();
    const inputs = stepsList.querySelectorAll(".step-input");
    inputs[inputs.length - 1].focus();
  });

  function openForm(recipe) {
    editingId = recipe ? recipe.id : null;
    formTitle.textContent = recipe ? "레시피 수정" : "레시피 추가";
    fTitle.value = recipe ? recipe.title : "";
    fTags.value = recipe ? recipe.tags.join(", ") : "";
    fIngredients.value = recipe ? recipe.ingredients.join("\n") : "";
    setStepRows(recipe ? recipe.steps : []);
    formOverlay.hidden = false;
    fTitle.focus();
  }

  function closeForm() {
    formOverlay.hidden = true;
    editingId = null;
    recipeForm.reset();
    setStepRows([]);
  }

  $("#addBtn").addEventListener("click", () => openForm(null));
  $("#formClose").addEventListener("click", closeForm);
  $("#formCancel").addEventListener("click", closeForm);
  formOverlay.addEventListener("click", (e) => {
    if (e.target === formOverlay) closeForm();
  });

  recipeForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const title = fTitle.value.trim();
    if (!title) return;
    const payload = {
      title,
      tags: splitTags(fTags.value),
      ingredients: splitLines(fIngredients.value),
      steps: collectSteps(),
    };
    const isEdit = Boolean(editingId);
    if (isEdit) {
      recipes = recipes.map((r) => (r.id === editingId ? { ...r, ...payload } : r));
    } else {
      recipes.push({ id: cryptoId(), createdAt: Date.now(), ...payload });
    }
    save();
    closeForm();
    render();
    showToast(isEdit ? "✏️ 레시피를 수정했어요" : "✨ 레시피를 추가했어요");
  });

  // ---- Search / sort ----
  searchInput.addEventListener("input", render);
  sortSelect.addEventListener("change", () => {
    sortMode = sortSelect.value;
    render();
  });

  // ---- Export / import ----
  $("#exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(recipes, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "recipes.json";
    a.click();
    URL.revokeObjectURL(url);
  });

  const importFile = $("#importFile");
  $("#importBtn").addEventListener("click", () => importFile.click());
  importFile.addEventListener("change", () => {
    const file = importFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!Array.isArray(parsed)) throw new Error("invalid");
        const incoming = parsed.filter((r) => r && typeof r.title === "string").map((r) => ({
          id: r.id || cryptoId(),
          title: r.title,
          tags: Array.isArray(r.tags) ? r.tags : [],
          ingredients: Array.isArray(r.ingredients) ? r.ingredients : [],
          steps: Array.isArray(r.steps) ? r.steps : [],
          createdAt: r.createdAt || Date.now(),
        }));
        const existingIds = new Set(recipes.map((r) => r.id));
        const merged = recipes.concat(incoming.filter((r) => !existingIds.has(r.id)));
        recipes = merged;
        save();
        render();
        alert(`🎉 ${incoming.length}개의 레시피를 가져왔어요.`);
      } catch (err) {
        alert("😥 파일을 읽을 수 없어요. 올바른 레시피 JSON 파일인지 확인해주세요.");
      } finally {
        importFile.value = "";
      }
    };
    reader.readAsText(file);
  });

  // Esc closes topmost modal
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!formOverlay.hidden) closeForm();
    else if (!detailOverlay.hidden) closeDetail();
  });

  render();
})();
</script>
</body>
</html>
